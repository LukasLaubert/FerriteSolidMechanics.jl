<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-labelledby="title desc">
  <title id="title">Four-point bending setup</title>
  <desc id="desc">Structured density 2 mesh for a 10 to 1 beam with two bottom supports and two loaded top segments.</desc>
  <rect width="920" height="370" fill="#ffffff"/>

  <text x="460" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#22313f">Four-point bending beam, L/H = 10</text>

  <g transform="translate(100 125)">
    <rect x="0" y="0" width="720" height="72" fill="#fbfcfd" stroke="#22313f" stroke-width="3"/>

    <g stroke="#2f3fa3" stroke-width="1.05" opacity="0.9">
      <line x1="36" y1="0" x2="36" y2="72"/>
      <line x1="72" y1="0" x2="72" y2="72"/>
      <line x1="108" y1="0" x2="108" y2="72"/>
      <line x1="144" y1="0" x2="144" y2="72"/>
      <line x1="180" y1="0" x2="180" y2="72"/>
      <line x1="216" y1="0" x2="216" y2="72"/>
      <line x1="252" y1="0" x2="252" y2="72"/>
      <line x1="288" y1="0" x2="288" y2="72"/>
      <line x1="324" y1="0" x2="324" y2="72"/>
      <line x1="360" y1="0" x2="360" y2="72"/>
      <line x1="396" y1="0" x2="396" y2="72"/>
      <line x1="432" y1="0" x2="432" y2="72"/>
      <line x1="468" y1="0" x2="468" y2="72"/>
      <line x1="504" y1="0" x2="504" y2="72"/>
      <line x1="540" y1="0" x2="540" y2="72"/>
      <line x1="576" y1="0" x2="576" y2="72"/>
      <line x1="612" y1="0" x2="612" y2="72"/>
      <line x1="648" y1="0" x2="648" y2="72"/>
      <line x1="684" y1="0" x2="684" y2="72"/>
      <line x1="0" y1="36" x2="720" y2="36"/>
    </g>

    <g stroke="#c0392b" stroke-width="5">
      <line x1="180" y1="0" x2="252" y2="0"/>
      <line x1="468" y1="0" x2="540" y2="0"/>
    </g>
    <g stroke="#c0392b" stroke-width="2" fill="#c0392b">
      <line x1="180" y1="-30" x2="252" y2="-30"/>
      <line x1="180" y1="-30" x2="180" y2="-8"/>
      <polygon points="176,-8 184,-8 180,0"/>
      <line x1="198" y1="-30" x2="198" y2="-8"/>
      <polygon points="194,-8 202,-8 198,0"/>
      <line x1="216" y1="-30" x2="216" y2="-8"/>
      <polygon points="212,-8 220,-8 216,0"/>
      <line x1="234" y1="-30" x2="234" y2="-8"/>
      <polygon points="230,-8 238,-8 234,0"/>
      <line x1="252" y1="-30" x2="252" y2="-8"/>
      <polygon points="248,-8 256,-8 252,0"/>
      <line x1="468" y1="-30" x2="540" y2="-30"/>
      <line x1="468" y1="-30" x2="468" y2="-8"/>
      <polygon points="464,-8 472,-8 468,0"/>
      <line x1="486" y1="-30" x2="486" y2="-8"/>
      <polygon points="482,-8 490,-8 486,0"/>
      <line x1="504" y1="-30" x2="504" y2="-8"/>
      <polygon points="500,-8 508,-8 504,0"/>
      <line x1="522" y1="-30" x2="522" y2="-8"/>
      <polygon points="518,-8 526,-8 522,0"/>
      <line x1="540" y1="-30" x2="540" y2="-8"/>
      <polygon points="536,-8 544,-8 540,0"/>
    </g>
    <text x="216" y="-45" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#c0392b">loaded top segment</text>
    <text x="504" y="-45" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#c0392b">loaded top segment</text>

    <g stroke="#22313f" stroke-width="2" fill="#ffffff">
      <polygon points="72,72 50,112 94,112"/>
      <line x1="44" y1="112" x2="100" y2="112"/>
      <circle cx="648" cy="92" r="20"/>
      <line x1="620" y1="112" x2="676" y2="112"/>
    </g>
    <text x="72" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#22313f">pinned support</text>
    <text x="72" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#22313f">u_x = u_y = 0</text>
    <text x="648" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#22313f">roller support</text>
    <text x="648" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#22313f">u_y = 0</text>

    <g stroke="#6c7a89" stroke-width="1.3" fill="none">
      <line x1="0" y1="205" x2="720" y2="205"/>
      <line x1="0" y1="199" x2="0" y2="211"/>
      <line x1="720" y1="199" x2="720" y2="211"/>
      <line x1="-36" y1="0" x2="-36" y2="72"/>
      <line x1="-42" y1="0" x2="-30" y2="0"/>
      <line x1="-42" y1="72" x2="-30" y2="72"/>
    </g>
    <text x="360" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6c7a89">L = 10H</text>
    <text x="-58" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6c7a89" transform="rotate(-90 -58 39)">H</text>

    <text x="72" y="-12" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#22313f">0.10L</text>
    <text x="216" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#22313f">0.30L</text>
    <text x="504" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#22313f">0.70L</text>
    <text x="648" y="-12" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#22313f">0.90L</text>
  </g>
</svg>
